name: Atualizar cards do perfil

# Todo dia às 12:34 (horário de Brasília = 15:34 UTC).
# Também pode ser disparado manualmente na aba Actions.
on:
  schedule:
    - cron: '34 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Gerar os cards SVG
        run: node scripts/gerar-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: madeiragab

      - name: Commitar se algo mudou
        # Autoria é do bot, não minha. Este commit é o Actions redesenhando um
        # SVG sozinho — assiná-lo com o meu nome e o meu e-mail enchia o meu
        # gráfico de contribuições de atividade que eu não fiz, e ainda
        # empurrava o trabalho de verdade para baixo do ruído diário.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "Nada mudou hoje — nenhum commit necessário."
          else
            git commit -m "chore(bot): redesenha os cards do perfil ($(date -u +%Y-%m-%d))"
            git push
          fi
